[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# We use sqlalchemy.url or override in env.py from settings
sqlalchemy.url = postgresql://zerotask_app:zerotask_secure_pass_2026@postgres:5432/zerotask

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
